<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda · Orientación James Mundell</title><style>:root{--n:#17345f;--b:#2875d7;--y:#f2c94c;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#18304f}header{background:#fff;border-bottom:4px solid var(--y);padding:22px 5%}main{max-width:900px;margin:25px auto;padding:0 18px}.card{background:#fff;padding:24px;border-radius:20px;box-shadow:0 7px 24px #17345f14;margin-bottom:18px}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:9px}.navy{background:var(--n);color:#fff}.info,.who{background:#eef6ff;padding:14px;border-radius:12px;line-height:1.6}label{display:block;font-weight:bold;margin:14px 0 7px}select,input,textarea{width:100%;padding:12px;border:1px solid #c8d3e2;border-radius:10px}.days,.slots{display:flex;flex-wrap:wrap;gap:8px}.days button,.slots button{padding:10px 13px;border:1px solid #b9cbe2;border-radius:10px;background:#fff;font-weight:bold;cursor:pointer}.on{background:var(--n)!important;color:#fff}.busy{background:#eee!important;color:#999!important;text-decoration:line-through}.result{display:none;background:#eaf8f1;padding:15px;border-radius:12px;margin-top:15px}.small{font-size:13px;color:#68788c}.back{display:inline-block;color:var(--b);font-weight:bold;text-decoration:none;margin-bottom:15px}.error{color:#a52626;font-weight:bold}@media(max-width:700px){.days button{flex:1 1 45%}}</style></head><body><header><h1>Liceo Bicentenario de Excelencia Polivalente James Mundell</h1><p>Orientación · Cholchol</p></header><main><a class="back" href="index.html">← Volver al inicio</a><div class="card"><h2 id="title"></h2><div id="studentWho" class="who" style="display:none"></div><p id="intro"></p><div class="info"><b>Horario de atención</b><br>Lunes a jueves: 08:15 a 16:00 hrs.<br>Viernes: 08:15 a 12:45 hrs.</div><p class="small">Se muestran fechas y horarios disponibles. Una hora reservada queda ocupada para estudiantes y apoderados.</p></div><div class="card"><div id="parentFields" style="display:none"><label>Nombre del apoderado/a</label><input id="parentName"><label>Nombre del estudiante</label><input id="studentName"><label>Curso del estudiante</label><select id="course"><option value="">Selecciona el curso</option><option>7°A</option><option>7°B</option><option>8°A</option><option>8°B</option><option>1°A</option><option>1°B</option><option>2°A</option><option>2°B</option><option>3° ADM</option><option>3° TUR</option><option>3° HC</option><option>4° ADM</option><option>4° TUR</option><option>4° HC</option></select></div><label>Motivo de la consulta</label><select id="reason"><option value="">Selecciona una opción</option><option>Orientación vocacional</option><option>Dudas sobre estudios o carreras</option><option>PAES y admisión</option><option>Becas, beneficios o financiamiento</option><option>Situación académica</option><option>Situación personal que deseo conversar</option><option>Otro motivo</option></select><label>Comentario (opcional)</label><textarea id="comment" rows="3"></textarea><label>Selecciona una fecha</label><div class="days" id="days"></div><div id="hourBox" style="display:none"><label>Selecciona una hora disponible</label><div class="slots" id="slots"></div></div><button class="btn navy" onclick="book()">Confirmar solicitud de hora</button><div id="err" class="error"></div><div class="result" id="result"></div></div></main><script>
const API='https://balkfwtnevbgwcjsseok.supabase.co/functions/v1/orientation-agenda',KEY='sb_publishable_6hJqOphmRz5vyeacLtvpLw_S9-E_-zT';let type=(location.hash||'#estudiante').slice(1),date='',time='',booked=new Set(),student=null;
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'No fue posible completar la solicitud.');return j}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function hours(d){let a=[],x=495,end=d.getDay()===5?765:960;while(x<end){if(!(d.getDay()!==5&&x>=780&&x<840))a.push(String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'));x+=30}return a}
async function init(){if(type!=='apoderado'){type='estudiante';try{student=JSON.parse(sessionStorage.getItem('jm_student')||'null')}catch(e){}if(!student){alert('Primero debes identificarte como estudiante.');location.href='estudiantes.html';return}title.textContent='📅 Agendar hora con Orientación';intro.textContent='Elige el motivo, la fecha y una hora disponible.';studentWho.style.display='block';studentWho.innerHTML='<b>👤 '+esc(student.full_name)+'</b><br>Curso: <b>'+esc(student.course)+'</b>';}else{title.textContent='👨‍👩‍👧 Atención de apoderados';intro.textContent='Selecciona un horario disponible para solicitar atención con Orientación.';parentFields.style.display='block'}await loadAvailability();renderDays()}
async function loadAvailability(){let s=new Date();s.setHours(0,0,0,0);let e=new Date(s);e.setDate(e.getDate()+30);const j=await call({action:'availability',start_date:iso(s),end_date:iso(e)});booked=new Set(j.booked.map(x=>x.date+'|'+x.time))}
function renderDays(){days.innerHTML='';let d=new Date();d.setHours(0,0,0,0);let count=0;while(count<10){if(d.getDay()>=1&&d.getDay()<=5){let copy=new Date(d),b=document.createElement('button');b.textContent=copy.toLocaleDateString('es-CL',{weekday:'short',day:'2-digit',month:'2-digit'});b.onclick=()=>pick(copy,b);days.appendChild(b);count++}d.setDate(d.getDate()+1)}}
function pick(d,b){date=iso(d);time='';document.querySelectorAll('.days button').forEach(x=>x.classList.remove('on'));b.classList.add('on');slots.innerHTML='';hours(d).forEach(h=>{let q=document.createElement('button');q.textContent=h;if(booked.has(date+'|'+h)){q.classList.add('busy');q.disabled=true}else q.onclick=()=>{time=h;document.querySelectorAll('.slots button').forEach(x=>x.classList.remove('on'));q.classList.add('on')};slots.appendChild(q)});hourBox.style.display='block'}
async function book(){err.textContent='';result.style.display='none';if(!reason.value||!date||!time){err.textContent='Selecciona motivo, fecha y hora.';return}let body={date,time,reason:reason.value,comment:comment.value};if(type==='estudiante')Object.assign(body,{action:'book_student',student_id:student.id});else{if(!parentName.value.trim()||!studentName.value.trim()||!course.value){err.textContent='Completa los datos del apoderado y estudiante.';return}Object.assign(body,{action:'book_parent',guardian_name:parentName.value.trim(),student_name:studentName.value.trim(),student_course:course.value})}try{await call(body);booked.add(date+'|'+time);result.style.display='block';result.innerHTML='<b>✅ Solicitud registrada</b><br><br>'+date+' · '+time+' hrs<br><b>Motivo:</b> '+esc(reason.value)+(type==='estudiante'?'<br><b>Estudiante:</b> '+esc(student.full_name)+' · '+esc(student.course):'');await loadAvailability();const active=[...document.querySelectorAll('.days button')].find(x=>x.classList.contains('on'));if(active)active.click()}catch(e){err.textContent=e.message;await loadAvailability()}}
window.addEventListener('DOMContentLoaded',init);
</script></body></html>
